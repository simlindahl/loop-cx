name: Ghost Run rules
on:
  pull_request:
    paths:
      - 'src/LoopCx/Features/GhostRun/**'
      - 'tests/GhostChecks/**'
      - 'tests/GhostStorageChecks/**'
      - 'storage/ghost/**'
      - '.github/workflows/ghost.yml'
      - 'global.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/GhostChecks
        env:
          MSBuildEnableWorkloadResolver: false
      - name: Check Ghost SQLite archive
        run: python3 tests/GhostStorageChecks/check.py
